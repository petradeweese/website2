  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400;700&family=Oswald:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
      --accent: #be9065;
      --border: #b88a61;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Oswald", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .site-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: var(--bg);
      padding: 26px 24px 0;
    }

    .brand {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .brand img {
      width: 108px;
      height: auto;
      display: block;
    }

    .nav-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 0 24px 22px;
      flex-wrap: wrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 34px;
      flex-wrap: wrap;
      font-family: "Antonio", sans-serif;
      font-size: 16px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .nav-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .action-btn {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 110px;
      min-height: 62px;
      padding: 10px 16px;
      background: var(--accent);
      border-radius: 8px;
      font-family: "Antonio", sans-serif;
      font-size: 12px;
      line-height: 1.15;
      text-transform: uppercase;
      text-align: center;
    }

    .divider {
      height: 4px;
      background: linear-gradient(180deg, #d1ad88 0%, #8f6849 100%);
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.18);
    }

    main {
      flex: 1;
      padding: 72px 20px 60px;
    }

    .form-wrap {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    footer {
      padding: 28px 20px 24px;
      text-align: center;
      font-size: 14px;
      line-height: 1.4;
    }

    @media (max-width: 960px) {
      .nav-row {
        gap: 20px;
      }

      .nav-links {
        gap: 20px;
        font-size: 14px;
      }
    }

    @media (max-width: 640px) {
      .topbar {
        padding-left: 16px;
        padding-right: 16px;
      }

      .nav-row {
        flex-direction: column;
        padding-left: 0;
        padding-right: 0;
      }

      .nav-links {
        gap: 16px;
      }

      main {
        padding-top: 44px;
      }
    }
  </style>
</head>
